---
name: Scripted Checks
'on': [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      # DPF, RtOsc and Zyn-Fusion are vendored upstream trees.
      - name: Run yamllint
        run: |
          for i in $(git ls-files '*.yml' ':!:DPF' ':!:rtosc' ':!:zyn-fusion-ui'); do
            yamllint $i
          done
