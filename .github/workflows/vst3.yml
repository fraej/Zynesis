---
name: VST3
'on': [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Linux VST3
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bison cmake pkg-config ruby rake \
            libfftw3-dev libmxml-dev liblo-dev zlib1g-dev libuv1-dev \
            libx11-dev libxcursor-dev libxext-dev libxrandr-dev \
            libgl-dev libglx-dev libopengl-dev libdbus-1-dev
      - name: Build
        run: ./scripts/build-vst3-linux.sh
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: ZynAddSubFX-linux-x86_64
          path: build-vst3/bin/ZynAddSubFX.vst3

  windows:
    name: Windows VST3 (MinGW-w64 cross-build)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix \
            autoconf automake libtool bison cmake ninja-build make \
            ruby rake zip
      - name: Cache Windows dependencies
        uses: actions/cache@v4
        with:
          path: build-win-deps/prefix
          key: win-deps-${{ hashFiles('scripts/build-windows-deps.sh') }}
      - name: Build
        run: ./scripts/build-vst3-windows.sh
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: ZynAddSubFX-windows-x86_64
          path: dist/ZynAddSubFX.vst3
