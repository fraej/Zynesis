---
name: CI
'on': [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: YAML lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4
      # DPF, RtOsc and Zyn-Fusion are vendored upstream trees.
      - name: Run yamllint
        run: yamllint $(git ls-files '*.yml' ':!:DPF' ':!:rtosc' ':!:zyn-fusion-ui')

  linux:
    name: Linux (tests and plugins)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bison cmake pkg-config ruby rake zip \
            libfftw3-dev libmxml-dev liblo-dev zlib1g-dev libuv1-dev \
            libx11-dev libxcursor-dev libxext-dev libxrandr-dev \
            libgl-dev libglx-dev libopengl-dev libdbus-1-dev
      - name: Build and run the tests
        run: |
          cmake -S . -B build-tests
          cmake --build build-tests --parallel
          ctest --test-dir build-tests --output-on-failure
      - name: Build the plugins
        run: ./scripts/build.sh linux
      - name: Upload the plugins
        uses: actions/upload-artifact@v4
        with:
          name: Zynth-linux-x86_64
          path: dist/linux

  windows:
    name: Windows plugins (MinGW-w64 cross-build)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix \
            autoconf automake libtool bison cmake make pkg-config \
            ruby rake zip curl
      - name: Cache the Windows dependencies
        uses: actions/cache@v4
        with:
          path: build-win-deps/prefix
          key: win-deps-${{ hashFiles('scripts/build-windows-deps.sh') }}
      - name: Build the plugins
        run: ./scripts/build.sh windows
      - name: Upload the plugins
        uses: actions/upload-artifact@v4
        with:
          name: Zynth-windows-x86_64
          path: dist/windows
